name: Build and check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Local checks (no credentials or live sends)
        run: bash scripts/check-local.sh
      - name: Universal macOS package
        run: bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Super-Input-Feishu-macOS
          path: dist/
